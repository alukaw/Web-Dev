Hello {{ city }}
<section (mouseover)="showSecretMessage()">
  <app-user [name]="userName" (notify)="onNotify()"/>
  @if (isLoggedIn) {
    <p>Welcome back!</p>
  } @else {
    <p>Please log in.</p>
  }
  <h3>User list:</h3>

  <ul>
    @for (user of users; track $index) {
      <li>{{ user }}</li>
    }
  </ul>

  <div [contentEditable]="isEditable">Edit me</div>

  <p>{{ message }}</p>
</section>
