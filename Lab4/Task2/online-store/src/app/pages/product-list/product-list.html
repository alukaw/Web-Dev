<section class="container">
  <h1 class="title">Online Store (Kaspi Catalog)</h1>

  <div class="grid">
    @for (p of products; track p.id) {
      <article class="card">
        <a class="image-link" [href]="p.link" target="_blank" rel="noopener noreferrer">
          <img class="main-img" [src]="getMainImage(p)" [alt]="p.name" />
        </a>

        <div class="thumbs">
          @for (img of p.images; track img) {
            <button type="button" class="thumb-btn" (click)="setMainImage(p, img)">
              <img class="thumb" [src]="img" [alt]="p.name" />
            </button>
          }
        </div>

        <h2 class="name">
          <a [href]="p.link" target="_blank" rel="noopener noreferrer">{{ p.name }}</a>
        </h2>

        <p class="desc">{{ p.description }}</p>

        <div class="meta">
          <div class="price">{{ p.price | number }} ₸</div>

          <div class="rating">
            <span class="stars">
              @for (s of stars(p.rating); track $index) {
                <span class="star" [class.filled]="s.filled">★</span>
              }
            </span>
            <span class="rating-num">{{ p.rating }}</span>
          </div>
        </div>

        <div class="actions">
          <a class="btn" [href]="whatsappShareLink(p)" target="_blank" rel="noopener noreferrer">
            Share WhatsApp
          </a>
          <a class="btn btn-secondary" [href]="telegramShareLink(p)" target="_blank" rel="noopener noreferrer">
            Share Telegram
          </a>
        </div>
      </article>
    }
  </div>
</section>
