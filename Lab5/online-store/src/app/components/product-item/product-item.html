<article class="card">

  <a class="imageWrap"
     [href]="product.link"
     target="_blank"
     rel="noopener">

    <img
      [src]="product.image"
      [alt]="product.name" />

  </a>

  <div class="content">

    <h3 class="title">
      <a [href]="product.link"
         target="_blank"
         rel="noopener">
        {{ product.name }}
      </a>
    </h3>

    <div class="meta">
      <span>⭐ {{ product.rating }}</span>
      <span class="price">
        {{ product.price | number }} ₸
      </span>
    </div>

    <p class="desc">
      {{ product.description }}
    </p>

    <div class="actions">
      <button type="button"
              class="btn"
              (click)="like()">
        ❤ {{ product.likes }}
      </button>

      <button type="button"
              class="btn"
              (click)="shareWhatsApp()">
        WhatsApp
      </button>

      <button type="button"
              class="btn"
              (click)="shareTelegram()">
        Telegram
      </button>

      <button type="button"
              class="btn danger"
              (click)="onDelete()">
        Delete
      </button>
    </div>

  </div>

</article>
